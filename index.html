<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glass Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Vazirmatn',sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

background:
linear-gradient(135deg,#f8f8f8,#e8e8e8);

overflow:hidden;

}

.calendar{

position:relative;

width:min(430px,95vw);

aspect-ratio:430/620;

height:auto;

padding:30px;

border-radius:36px;

background:rgba(255,255,255,.28);

backdrop-filter:blur(28px);
-webkit-backdrop-filter:blur(28px);

border:1px solid rgba(255,255,255,.6);

box-shadow:
0 30px 70px rgba(0,0,0,.18),
inset 0 1px 0 rgba(255,255,255,.9);

overflow:hidden;

}

.calendar::before{

content:"";

position:absolute;

top:-120px;
left:-120px;

width:260px;
height:260px;

border-radius:50%;

background:rgba(255,255,255,.95);

filter:blur(70px);

}

.calendar::after{

content:"";

position:absolute;

bottom:-100px;
right:-100px;

width:220px;
height:220px;

border-radius:50%;

background:rgba(255,255,255,.6);

filter:blur(60px);

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

position:relative;

z-index:2;

}

.month{

font-size:34px;

font-weight:700;

color:#222;

}

.year{

font-size:18px;

color:#8b8b8b;

margin-top:5px;

}

.weekdays{

display:grid;

grid-template-columns:repeat(7,1fr);

text-align:center;

margin-bottom:20px;

color:#888;

font-size:17px;

position:relative;

z-index:2;

}

.days{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:12px;

position:relative;

z-index:2;

}

.day{

height:48px;

display:flex;

align-items:center;

justify-content:center;

border-radius:16px;

font-size:18px;

color:#333;

transition:.25s;

}

.day:hover{

background:rgba(255,255,255,.55);

transform:translateY(-3px) scale(1.08);

cursor:pointer;

}

.today{

width:48px;

height:48px;

margin:auto;

display:flex;

align-items:center;

justify-content:center;

border-radius:50%;

background:linear-gradient(
180deg,
#2b2b2b,
#0d0d0d
);

color:#fff;

font-weight:700;

border:1px solid rgba(255,255,255,.15);

box-shadow:

0 15px 30px rgba(0,0,0,.35),

inset 0 1px 1px rgba(255,255,255,.20),

inset 0 -2px 3px rgba(0,0,0,.25);

}

.footer{

position:absolute;

left:25px;
right:25px;
bottom:25px;

padding:16px;

border-radius:20px;

background:rgba(255,255,255,.35);

backdrop-filter:blur(18px);

text-align:center;

font-size:18px;

color:#666;

z-index:2;

}
/* ===== Glass Upgrade ===== */

body{

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

background:
radial-gradient(circle at top left,#3d3d3d,#111 70%),
linear-gradient(135deg,#1d1d1d,#000);

overflow:hidden;
}

.calendar{

background:rgba(255,255,255,.14);

backdrop-filter:blur(40px) saturate(180%);

-webkit-backdrop-filter:blur(40px) saturate(180%);

border:1px solid rgba(255,255,255,.45);

box-shadow:

0 35px 80px rgba(0,0,0,.20),

inset 0 1px 0 rgba(255,255,255,.9),

inset 0 -1px 0 rgba(255,255,255,.15);

transition:.4s;

}

.calendar:hover{

transform:translateY(-8px);

rotate:.5deg;

scale:1.015;

box-shadow:

0 45px 90px rgba(0,0,0,.24);

}

.calendar::before{

content:"";

position:absolute;

top:-180px;

left:-120px;

width:300px;

height:900px;

background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.35),
transparent
);

transform:rotate(30deg);

pointer-events:none;

animation:glassLight 8s linear infinite;

}
.calendar::after{

content:"";

position:absolute;

top:0;

left:0;

right:0;

height:120px;

background:linear-gradient(

to bottom,

rgba(255,255,255,.35),

transparent

);

pointer-events:none;

}

.month{

font-size:42px;

font-weight:700;

letter-spacing:.5px;

text-shadow:0 2px 8px rgba(255,255,255,.35);

}

.year{

font-size:20px;

}

.day{

border-radius:18px;

font-size:20px;

}

.day:hover{

background:rgba(255,255,255,.45);

transform:scale(1.12);

}

.today{

width:48px;

height:48px;

margin:auto;

border-radius:50%;

background:#111;

color:#fff;

box-shadow:

0 12px 28px rgba(0,0,0,.35);

}

.footer{

background:rgba(255,255,255,.18);

backdrop-filter:blur(30px);

border:1px solid rgba(255,255,255,.35);

}
/* ========= Apple Glass Finish ========= */

.calendar{

overflow:hidden;

}

.calendar .glass-line{

position:absolute;

top:18px;

left:18px;

right:18px;

height:1px;

background:linear-gradient(

90deg,

transparent,

rgba(255,255,255,.95),

transparent

);

opacity:.9;

z-index:5;

}

.calendar .glass-glow{

position:absolute;

top:-120px;

right:-120px;

width:260px;

height:260px;

border-radius:50%;

background:radial-gradient(

circle,

rgba(255,255,255,.55),

transparent 70%

);

filter:blur(55px);

z-index:0;

pointer-events:none;

}

.calendar .glass-shadow{

position:absolute;

bottom:-140px;

left:-100px;

width:260px;

height:260px;

border-radius:50%;

background:radial-gradient(

circle,

rgba(0,0,0,.12),

transparent 70%

);

filter:blur(70px);

z-index:0;

pointer-events:none;

}

.header,
.weekdays,
.days,
.footer{

position:relative;

z-index:10;

}

.day{

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

}

.day:hover{

background:rgba(255,255,255,.65);

box-shadow:

0 8px 18px rgba(255,255,255,.35),

0 8px 18px rgba(0,0,0,.08);

}

.today{

background:linear-gradient(

180deg,

#2d2d2d,

#0f0f0f

);

border:1px solid rgba(255,255,255,.15);

box-shadow:

0 10px 24px rgba(0,0,0,.35),

inset 0 1px 1px rgba(255,255,255,.18);

}

.month{

letter-spacing:.5px;

}

.footer{

box-shadow:

inset 0 1px 1px rgba(255,255,255,.35);

border:1px solid rgba(255,255,255,.25);

}
/* ===== Animation ===== */

@keyframes cardShow{

0%{
opacity:0;
transform:translateY(30px) scale(.96);
}

100%{
opacity:1;
transform:translateY(0) scale(1);
}

}

.calendar{

animation:cardShow .7s ease;

transform-style:preserve-3d;

perspective:1000px;

}
@keyframes glassLight{

0%{

transform:
translateX(-220px)
rotate(30deg);

}

100%{

transform:
translateX(520px)
rotate(30deg);

}

}
</style>

</head>
<body>

<div class="calendar">

<div class="glass-line"></div>

<div class="glass-glow"></div>

<div class="glass-shadow"></div>

<div class="header">

<div>

<div class="month" id="month">
مرداد
</div>

<div class="year" id="year">
۱۴۰۵
</div>

</div>

<div style="text-align:left;">

<div style="font-size:42px;font-weight:700;color:#222;" id="todayNumber">
۱۱
</div>

<div style="color:#888;font-size:14px;" id="todayName">
شنبه
</div>

</div>

</div>

<div class="weekdays">

<div>ش</div>
<div>ی</div>
<div>د</div>
<div>س</div>
<div>چ</div>
<div>پ</div>
<div>ج</div>

</div>

<div class="days" id="days">

</div>

<div class="footer">

<div id="fullDate">

درحال بارگذاری...

</div>

</div>

</div>

<script>

const monthNames=[
"فروردین",
"اردیبهشت",
"خرداد",
"تیر",
"مرداد",
"شهریور",
"مهر",
"آبان",
"آذر",
"دی",
"بهمن",
"اسفند"
];

const weekNames=[
"یکشنبه",
"دوشنبه",
"سه‌شنبه",
"چهارشنبه",
"پنجشنبه",
"جمعه",
"شنبه"
];

const now=new Date();

document.getElementById("todayName").innerHTML=

weekNames[now.getDay()];

document.getElementById("todayNumber").innerHTML=

now.getDate();

document.getElementById("month").innerHTML=

new Intl.DateTimeFormat("fa-IR",{

month:"long"

}).format(now);

document.getElementById("year").innerHTML=

new Intl.DateTimeFormat("fa-IR",{

year:"numeric"

}).format(now);

document.getElementById("fullDate").innerHTML=

new Intl.DateTimeFormat("fa-IR",{

weekday:"long",

day:"numeric",

month:"long",

year:"numeric"

}).format(now);

const days=document.getElementById("days");

const total=new Date(

now.getFullYear(),

now.getMonth()+1,

0

).getDate();

const first=new Date(

now.getFullYear(),

now.getMonth(),

1

).getDay();

const start=(first+1)%7;

for(let i=0;i<start;i++){

const e=document.createElement("div");

days.appendChild(e);

}

for(let i=1;i<=total;i++){

const d=document.createElement("div");

d.className="day";

d.innerHTML=i;

if(i===now.getDate()){

d.classList.add("today");

}

days.appendChild(d);

}
</script>

</body>

</html>
